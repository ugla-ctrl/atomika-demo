<style>
/* Layout: a full-bleed 3D stage; ATOMIKA UI floats over it (top bar, station card bottom-left, station rail on the right at desktop width). Single dark look, by design. */
:root{
  --bg:#000000;
  --fg:#ffffff;
  --muted:#A3A3A3;
  --line:#2B2B2B;
  --panel:rgba(8,8,8,0.82);
  --orange:#FF7E1D;
  --cyan:#01CFFE;
  --blue:#0077D8;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--display);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:var(--bg)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none;transition:opacity .4s}
#c.dragging{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top svg{height:16px;width:auto;display:block}
.readout{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.readout span{padding:5px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
#depth{color:var(--cyan);font-variant-numeric:tabular-nums}
.sound{pointer-events:auto;cursor:pointer;min-height:34px;padding:0 12px;border-radius:999px;background:var(--orange);color:#000;border:0;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.sound[aria-pressed="true"]{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.sound:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.card{max-height:calc(100dvh - 88px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(430px,calc(100vw - 32px));box-sizing:border-box;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-size:clamp(28px,5.4vw,40px);line-height:.98;font-weight:700;font-stretch:112%;letter-spacing:-.02em;text-wrap:balance}
#desc{margin:0;font-size:16px;line-height:1.35;color:#C9C9C9;text-wrap:pretty;max-width:60ch}
#scene-backdrop{display:none}
.station-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.station-picker{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.dots{display:flex;gap:4px}
.dots button{flex:1 1 0;height:14px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center}
.dots button::before{content:"";display:block;width:100%;height:3px;border-radius:2px;background:#2E2E2E}
.dots button.done::before{background:var(--cyan)}
.dots button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center}
.btn{height:48px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn.ghost{padding:0 20px;background:#151515;border:1px solid #5E5E5E;color:var(--fg)}
.btn.ghost:disabled{opacity:.35;cursor:default}
.btn.primary{flex:1 1 auto;padding:0 20px;background:var(--orange);border:0;color:#000}
.btn.primary:hover{background:#FF9440}
.btn.link{flex:1 1 auto;background:var(--blue);color:#fff;border:0}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#7C7C7C}
.rail{max-height:calc(100dvh - 132px);overflow-y:auto;overscroll-behavior:contain;position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;gap:10px;align-items:center;justify-content:flex-end;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8A8A8A;font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer;text-align:right}
.rail button .n{font-family:var(--mono);font-weight:400;font-size:11px}
.rail button[aria-current="step"]{color:#fff;background:var(--panel);border-color:var(--line)}
.rail button[aria-current="step"] .n{color:var(--cyan)}
.rail button:hover{color:#fff}
.rail button:focus-visible{outline:2px solid var(--cyan)}
@media (max-width:899px){
 .rail{display:none}
 .station-picker{display:block;flex:none}
 .station-picker select{width:112px;min-height:44px;border:1px solid var(--line);border-radius:999px;background:#151515;color:var(--fg);font:500 12px var(--display);padding:0 10px;cursor:pointer}
 .station-picker select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
 .dots{display:none}
 .top{gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 .top svg{height:14px}
 .readout{gap:4px;font-size:9px;letter-spacing:.02em}
 .readout span{padding:5px 7px}
 .sound{min-height:44px;padding:0 8px;font-size:9px;letter-spacing:.02em}
 .pill-proto{display:none}
 .card{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));padding:14px;gap:8px;border-radius:16px}
 .eyebrow{font-size:9px;line-height:1.5;letter-spacing:.04em}
 h1{font-size:clamp(25px,6vw,32px);line-height:1.03}
 #desc{font-size:14px;line-height:1.4}
 .row{flex-wrap:wrap}
 .row #next{flex:1 1 0}
 .row #cta{flex-basis:100%}
 .btn{font-size:14px;min-width:0}
 .btn.ghost{padding:0 16px}
 .btn.primary{padding:0 12px}
 .hint{font-size:9px;line-height:1.4;letter-spacing:.02em}
}
@media (max-width:420px){.readout .pill-proto{display:none}}
@media (pointer:coarse){.dots button{height:28px}.sound{min-height:44px}}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
/* photoreal station plates: shown on arrival, dissolve back to the live 3D view on drag or departure */
#photos{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;background:transparent}
#photos img{position:absolute;inset:-7%;width:114%;height:114%;object-fit:cover;opacity:0;will-change:opacity,transform,filter}
#photos{background:#000}
#photos video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;background:#000}
#photos video{will-change:opacity;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){#photos img{inset:0;width:100%;height:100%}}
/* A portrait screen shows the complete filmed route above its controls. */
@media (max-width:899px) and (orientation:portrait){
 #scene-backdrop{display:block;position:fixed;inset:-24px;z-index:1;background-size:cover;background-position:center;filter:blur(22px) brightness(.32) saturate(.65);pointer-events:none}
 #photos{background:transparent;top:calc(62px + env(safe-area-inset-top,0px));bottom:calc(var(--card-height,290px) + 28px + env(safe-area-inset-bottom,0px))}
 #photos video,#photos img{object-fit:contain;object-position:50% 50%;background:transparent}
 #photos img{inset:0;width:100%;height:100%;transform:none!important}
 .card{width:calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-height:56dvh}
}
@media (max-height:520px) and (orientation:landscape){
 .card{width:min(340px,calc(100vw - 24px));padding:12px;gap:6px;max-height:calc(100dvh - 76px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
 .station-heading .eyebrow{font-size:9px}
 h1{font-size:25px}
 #desc{font-size:13px}
 .hint{display:none}
}

.tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;transform:translate(-50%,-100%);white-space:nowrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--cyan);background:rgba(0,0,0,.72);border:1px solid rgba(1,207,254,.55);border-radius:999px;padding:6px 10px;cursor:default;transition:opacity .25s}
.tag.go{cursor:pointer;background:var(--cyan);color:#000;border-color:var(--cyan)}
.tag.city,.tag.warm{color:#FFD9A3;border-color:rgba(255,217,163,.5)}
.tag.small{font-size:10px;padding:4px 8px;color:#BFEFFF;border-color:rgba(191,239,255,.35)}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:currentColor;opacity:.7}
.tag.go::after{background:var(--cyan)}
.tag[hidden]{display:none}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);font-size:16px}
@media (prefers-reduced-motion:reduce){.tag{transition:none}}
</style>

</head>
